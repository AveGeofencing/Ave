services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://admin:password@pg_db:5432/geofencedb
      ALEMBIC_DATABASE_URL: postgresql+psycopg://admin:password@pg_db:5432/geofencedb
    depends_on:
      pg_db:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - /app/.venv/bin/alembic upgrade head && exec /app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000

  pg_db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: geofencedb
    ports:
      - "5431:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d geofencedb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
